[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "before-return"
version = "0.1.0"
description = "Checkout-time return risk prediction MVP for ASOS GraphReturns."
requires-python = ">=3.11,<3.13"
dependencies = [
  "catboost>=1.2.7",
  "fastapi>=0.115.0",
  "joblib>=1.4.2",
  "matplotlib>=3.9.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.9.0",
  "requests>=2.32.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.13.0",
  "shap>=0.46.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
